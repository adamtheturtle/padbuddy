# Periphery configuration — enforced dead-code detection (#457).
#
# Periphery finds unused Swift code (types, functions, properties, enum cases,
# protocol conformances) across the whole project, catching symbols orphaned
# across our many split-out extension files (ContentView+…, MergedPadsView+…)
# that SwiftLint's per-file analysis can't see.
#
# Run locally with:  periphery scan
# CI fails on findings not already captured in .periphery-baseline. Review and
# delete newly reported code instead of refreshing the baseline unless a result
# is verified as a runtime or platform-specific false positive.

project: PadBuddy.xcodeproj

# Build the app scheme. It builds the test targets too, so a symbol referenced
# only from a test still counts as used and isn't reported as dead.
schemes:
  - PadBuddy

# The project can list two same-named "PadBuddy" schemes (the shared one plus an
# autogenerated duplicate), which trips Periphery's scheme validation; skip it.
skip_schemes_validation: true

# Known runtime-discovered and platform-specific symbols. The baseline stores
# stable Swift USRs rather than excluding whole files, so new dead code in those
# files is still reported.
baseline: .periphery-baseline

# Findings inside the test targets are noise here — unreferenced @Test methods
# are invoked reflectively by the runner, and unused test helpers aren't product
# dead code. The test sources are still indexed (so test→app references retain
# app symbols); they're just excluded from the report.
report_exclude:
  - "PadBuddyTests/**"
  - "PadBuddyUITests/**"
  # Local package checkouts can live beside the repo during development; dead
  # code in that separately owned package should be handled in its own CI.
  - "**/CoderPadMCP/**"

# --- Retain rules: suppress this app's known false-positive sources ----------

# The app exposes symbols across the app↔widget-extension boundary and to the
# system (AppIntents / AppShortcuts are discovered by the OS, not referenced in
# Swift). Retaining public declarations keeps those from being flagged.
retain_public: true

# @objc / dynamic members are reachable from the Objective-C runtime (selectors,
# NSTableView target/action in the ListTable bridge, AppKit menu validation).
retain_objc_accessible: true

# SwiftUI previews (#Preview / PreviewProvider) are entry points the compiler
# keeps but nothing references in Swift.
retain_swift_ui_previews: true

# Codable models decode many fields from the CoderPad / Screen REST APIs that
# aren't read back in Swift; they must stay for the decode to round-trip.
retain_codable_properties: true

# Properties only ever assigned (never read) are often deliberate — @State the
# UI mutates, retained references that keep a delegate/observer alive. Keep them
# out of the report rather than churning the UI code chasing false positives.
retain_assign_only_properties: true

# Output the unused-symbol report grouped, easy to scan in CI logs.
format: xcode

name: Release

# Builds a Release build and publishes a GitHub Release when a semver tag is
# pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
#
# When the Developer ID signing + notarization secrets are configured (see
# below), the workflow signs the app with a Developer ID Application identity,
# packages it as a notarized, stapled `.dmg`, and attaches that — so it opens
# cleanly on other people's Macs without a Gatekeeper warning (#150).
#
# When those secrets are absent it falls back to an ad-hoc/unsigned `.zip`,
# which is fine for testing and archival but not redistribution.
#
# Required repository secrets for the signed path:
#   DEVELOPER_ID_APP_CERT_P12_BASE64  base64 of the Developer ID Application
#                                     certificate + private key, exported as .p12
#   DEVELOPER_ID_APP_CERT_PASSWORD    password protecting that .p12
#   NOTARY_APPLE_ID                   Apple ID email for notarytool
#   NOTARY_PASSWORD                   app-specific password for that Apple ID
#   NOTARY_TEAM_ID                    Apple Developer Team ID (e.g. 6L9H6Q8CUF)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    timeout-minutes: 30
    # Derived once from the presence of signing secrets; every conditional step
    # keys off this so the workflow degrades gracefully to an unsigned .zip.
    env:
      SIGNING_AVAILABLE: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 != '' && secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags so release notes can diff against the prior tag.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate built app
        id: app
        run: |
          # Match by extension, not a hard-coded name: the product is CoderPad.app
          # (PRODUCT_NAME=CoderPad), and `find -name` is case-sensitive even on a
          # case-insensitive filesystem, so 'coderpad.app' would never match.
          APP="$(find DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "Built app not found"; exit 1; }
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      # --- Signed path: Developer ID + notarization (when secrets present) ---

      - name: Import signing certificate
        if: env.SIGNING_AVAILABLE == 'true'
        # Pinned to the v6.1.0 commit SHA for supply-chain safety. The action
        # creates a temporary `signing_temp` keychain, imports the cert with a
        # non-interactive partition list, and adds it to the user search list —
        # replacing the hand-rolled `security` bash this step used to carry (#363).
        uses: apple-actions/import-codesign-certs@fe74d46e82474f87e1ba79832ad28a4013d0e33a
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}

      - name: Resolve signing identity
        if: env.SIGNING_AVAILABLE == 'true'
        # The action doesn't return the identity string, but it left the imported
        # cert's keychain on the search list, so find it there and export it for
        # scripts/package-and-notarize.sh (which reads $SIGNING_IDENTITY).
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)".*/\1/')"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity found"; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign, notarize, and package (.dmg)
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ./scripts/package-and-notarize.sh \
            "${{ steps.app.outputs.path }}" \
            "coderpad-${GITHUB_REF_NAME}.dmg"

      # --- Fallback path: ad-hoc/unsigned .zip (when secrets absent) ---------

      - name: Package app (ad-hoc .zip)
        if: env.SIGNING_AVAILABLE != 'true'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.app.outputs.path }}" "coderpad-${GITHUB_REF_NAME}.zip"

      # --- Publish ----------------------------------------------------------

      - name: Generate release notes
        run: ./scripts/release-notes.sh > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=()
          for f in "coderpad-${GITHUB_REF_NAME}.dmg" "coderpad-${GITHUB_REF_NAME}.zip"; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          gh release create "${GITHUB_REF_NAME}" \
            "${ASSETS[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

name: Release

# Builds a Release .app and publishes a GitHub Release when a semver tag is
# pushed (e.g. `git tag v1.0.0 && git push origin v1.0.0`). The produced .app is
# ad-hoc/unsigned — suitable as a build artifact for testing and archival.
# Developer ID signing + notarization for redistribution is tracked separately
# (#29, #150) and requires signing secrets this workflow intentionally omits.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build & publish
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so release notes can diff against the prior tag.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          APP="$(find DerivedData/Build/Products/Release -maxdepth 1 -name 'coderpad.app' -print -quit)"
          test -n "$APP" || { echo "Built app not found"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "coderpad-${GITHUB_REF_NAME}.zip"

      - name: Generate release notes
        run: ./scripts/release-notes.sh > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "coderpad-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

name: App Store

# Archives the Sparkle-free `CoderPad-AppStore` target (#483) as a validation
# check only. App Store Connect submission is handled by Xcode Cloud; GitHub
# Actions must not publish App Store builds, otherwise there are two competing
# release paths.
#
# Trigger: a manual dispatch, or pushing an `appstore-v*` tag (e.g.
# `git tag appstore-v1.2.3 && git push origin appstore-v1.2.3`). Keeping a
# dedicated tag — rather than piggybacking release.yml's `v*` — lets the App
# Store and Developer ID channels be cut independently (#487 open question).
on:
  push:
    tags:
      - 'appstore-v*'
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version (e.g. 1.2.3). Defaults to the latest v* tag minus its leading v.'
        required: false
        default: ''

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appstore:
    name: Validate archive
    runs-on: macos-26
    timeout-minutes: 40
    env:
      MACOS_ARCHIVE_PATH: build/PadBuddy-macOS.xcarchive
      IOS_ARCHIVE_PATH: build/PadBuddy-iOS.xcarchive
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so release validation can inspect prior tagged project versions.
          fetch-depth: 0

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 matches ci.yml and release.yml.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Resolve version
        id: version
        env:
          INPUT: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          # MARKETING_VERSION: the dispatch input if given; else an appstore-v* /
          # v* tag minus its prefix; else the latest v* tag. CURRENT_PROJECT_VERSION
          # is committed by bump-version.sh so tags record uploaded build numbers.
          if [ -n "$INPUT" ]; then
            MARKETING_VERSION="$INPUT"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            MARKETING_VERSION="${TAG#appstore-v}"
            MARKETING_VERSION="${MARKETING_VERSION#v}"
          else
            LATEST="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            MARKETING_VERSION="${LATEST#v}"
          fi
          test -n "$MARKETING_VERSION" || { echo "Could not resolve a marketing version"; exit 1; }
          BUILD_NUMBER="$(grep -Eo 'CURRENT_PROJECT_VERSION = [0-9]+;' coderpad.xcodeproj/project.pbxproj \
            | grep -Eo '[0-9]+' | sort -n | tail -1)"
          echo "Marketing version $MARKETING_VERSION (build $BUILD_NUMBER)"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate version and build number
        run: |
          set -euo pipefail
          # A dispatch still validates in the App Store channel even though it
          # has no pushed tag. This permits the same version as a direct v* release
          # while continuing to reject an existing appstore-v* upload.
          TAG_NAME="appstore-v${{ steps.version.outputs.marketing_version }}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          fi
          scripts/validate-release-version.sh \
            "${{ steps.version.outputs.marketing_version }}" \
            "${{ steps.version.outputs.build_number }}" \
            "$TAG_NAME"
          scripts/check-accessibility-release-gate.sh

      - name: Archive and verify Sparkle-free
        run: |
          set -o pipefail
          # App Store Connect submission is owned by Xcode Cloud. This GitHub
          # check only proves the App Store target archives and embeds no
          # Sparkle.framework, so a regression fails before release.
          xcodebuild archive \
            -project coderpad.xcodeproj \
            -scheme CoderPad-AppStore \
            -configuration AppStoreRelease \
            -destination 'generic/platform=macOS' \
            -archivePath "$MACOS_ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}"
          APP="$(find "$MACOS_ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "Archived app not found"; exit 1; }
          echo "Archived $APP"
          if [ -e "$APP/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::Sparkle.framework is embedded in the App Store target — it must be Sparkle-free (#483)."
            exit 1
          fi
          echo "OK: no Sparkle.framework under $APP/Contents/Frameworks (Sparkle-free)."

      - name: Archive iPhone and iPad product
        run: |
          set -o pipefail
          # Exercise the real AppStoreRelease archive action for the mobile
          # product, including its resources, widget, entitlements, and archive
          # installation layout. Signing remains disabled because Xcode Cloud
          # owns distribution credentials.
          xcodebuild archive \
            -project coderpad.xcodeproj \
            -scheme CoderPad-AppStore \
            -configuration AppStoreRelease \
            -destination 'generic/platform=iOS' \
            -archivePath "$IOS_ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}"
          APP="$(find "$IOS_ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "::error::Archived iOS app not found"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::Archived iOS app has no Info.plist"; exit 1; }
          test -d "$APP/PlugIns/RecentPadsWidgetExtension.appex" \
            || { echo "::error::Archived iOS app does not contain its widget extension"; exit 1; }
          if [ -e "$APP/Frameworks/Sparkle.framework" ]; then
            echo "::error::Sparkle.framework is embedded in the iOS App Store product."
            exit 1
          fi
          echo "Archived and validated iPhone/iPad product at $APP"

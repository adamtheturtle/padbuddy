name: CI

on:
  # Lint and dead-code checks run on every push/PR. Pull requests also compile
  # the iOS app; the full macOS test plan stays nightly.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  # Allow manually kicking off a run from the Actions tab when needed.
  workflow_dispatch:

# Cancel an in-progress run when a newer run starts on the same ref.
# macOS runners bill at 10x minutes, so not paying for superseded builds matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint the workflow files themselves: catches invalid syntax, bad expressions,
  # and (via the runner's preinstalled shellcheck) bugs in embedded `run:`
  # scripts. Runs on Linux — cheap, and unrelated to the macOS build.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            -o "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color

  # Lint the standalone shell scripts. actionlint only covers shell embedded in
  # workflow `run:` blocks, so the scripts under scripts/ and ci_scripts/ would
  # otherwise go unchecked. shellcheck is preinstalled on the runner.
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run shellcheck
        run: shellcheck scripts/*.sh ci_scripts/*.sh

  # Swift style gate. Runs on every push/PR (and nightly) so a SwiftLint or
  # SwiftFormat regression is caught before it lands on main, rather than only
  # surfacing in the nightly build. It runs on a 1x Linux runner (see the
  # container note below), so there is no per-push macOS cost — the expensive
  # full macOS test job stays nightly/manual. Both tools run as prebuilt binaries
  # at a pinned version so CI matches the local toolchain; bump these in lockstep with
  # any local upgrade.
  swift-lint:
    name: SwiftLint & SwiftFormat
    runs-on: ubuntu-latest
    # The SwiftLint/SwiftFormat Linux binaries dlopen the Swift runtime and
    # sourcekitd at launch; a bare ubuntu-latest runner ships no Swift, so they
    # wouldn't start. The official Swift toolchain image supplies both. 6.2
    # matches the Swift version in Xcode 26.5 that the macOS jobs select, so the
    # sourcekit SwiftLint parses with is the same one used locally.
    container: swift:6.2
    timeout-minutes: 10
    # Inside a container GitHub runs `run:` steps with `sh` (dash), which rejects
    # the `set -o pipefail` bashism the steps below rely on; the image ships bash,
    # so pin it explicitly to match the bash the macOS runner used by default.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The full Swift image ships git but not the unzip/curl this job uses to
      # fetch and unpack the pinned release binaries.
      - name: Install fetch tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl jq unzip

      - name: SwiftLint (strict)
        env:
          SWIFTLINT_VERSION: 0.63.3
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -o -q swiftlint.zip
          chmod +x swiftlint
          ./swiftlint version
          ./swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (lint)
        env:
          SWIFTFORMAT_VERSION: 0.62.1
        run: |
          set -euo pipefail
          curl -sSfL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          # The Linux zip unpacks a binary named `swiftformat_linux` (the macOS
          # zip used `swiftformat`).
          unzip -o -q swiftformat.zip
          chmod +x swiftformat_linux
          ./swiftformat_linux --version
          ./swiftformat_linux . --lint --reporter github-actions-log

      # Localization gate: fails if any user-facing string in a .xcstrings catalog
      # is missing a complete `es` translation, so a newly-added string can't land
      # on main unlocalised. Reuses the Swift toolchain this container already
      # ships (no extra download) — the checker is dependency-free Foundation.
      # scripts/check-localization.swift documents the full policy.
      - name: Localization completeness (strict)
        run: |
          set -euo pipefail
          swift scripts/check-localization.swift

      - name: User-facing source localization audit
        run: |
          set -euo pipefail
          swift scripts/check-localized-source.swift
          scripts/test-localized-source-audit.sh

      # Keep the iOS host and widget on the same App Group, and retain the KVS
      # entitlement that backs cross-device favourites and saved searches (#575).
      - name: iOS entitlement parity
        run: |
          set -euo pipefail
          swift scripts/check-ios-entitlements.swift

      - name: Privacy manifests
        run: scripts/check-privacy-manifests.sh

      - name: Accessibility release gate tests
        run: scripts/test-accessibility-release-gate.sh

  build-platforms:
    name: Build (${{ matrix.name }})
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: generic/platform=macOS
            derived-data: macos
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
            derived-data: ios
          - name: tvOS Simulator
            destination: generic/platform=tvOS Simulator
            derived-data: tvos
          - name: visionOS Simulator
            destination: generic/platform=visionOS Simulator
            derived-data: visionos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The analyzer compares the checked-out commit with the event's base
          # revision to ratchet unused imports over the complete PR or push.
          fetch-depth: 0

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          scripts/check-xcode-version.sh

      # The macOS build log supplies SourceKit with the exact compiler arguments
      # needed by SwiftLint's analyzer-only rules. This is a fresh CI build, so
      # the log contains a compile command for every app source file.
      - name: Build macOS app and capture compiler log
        if: matrix.name == 'macOS'
        run: |
          set -euo pipefail
          # SwiftLint needs the unsuppressed compiler invocations, so this one
          # build cannot use -quiet. The wrapper retains the complete log while
          # printing only diagnostics (or the timing summary on success).
          scripts/run-xcodebuild.sh xcodebuild-macos.log build \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath 'DerivedData-${{ matrix.derived-data }}' \
            -resultBundlePath 'Build-${{ matrix.derived-data }}.xcresult' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install SwiftLint analyzer
        if: matrix.name == 'macOS'
        env:
          SWIFTLINT_VERSION: 0.63.3
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q swiftlint.zip
          chmod +x swiftlint
          ./swiftlint version

      - name: SwiftLint analyzer rules
        if: matrix.name == 'macOS'
        env:
          SWIFTLINT_ANALYZER_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          SWIFTLINT_BIN="$PWD/swiftlint" \
            scripts/run-swiftlint-analyzer.sh xcodebuild-macos.log

      # Compile every non-macOS platform branch and validate platform-filtered
      # SwiftPM products without booting a simulator or requiring signing
      # (#4155). Each matrix leg uses isolated DerivedData so explicit-module
      # artifacts from one SDK cannot contaminate another platform build.
      - name: Build ${{ matrix.name }} app
        if: matrix.name != 'macOS'
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh 'xcodebuild-${{ matrix.derived-data }}.log' build \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath 'DerivedData-${{ matrix.derived-data }}' \
            -resultBundlePath 'Build-${{ matrix.derived-data }}.xcresult' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed platform build results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Build-${{ matrix.derived-data }}
          path: |
            Build-${{ matrix.derived-data }}.xcresult
            xcodebuild-*.log
          if-no-files-found: warn
          retention-days: 14

  test-fast:
    name: Fast tests
    # Keep pull requests protected by deterministic unit and render-policy tests
    # without paying for the UI tests in the Full nightly plan (#4156).
    if: github.event_name == 'pull_request'
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          scripts/check-xcode-version.sh

      - name: Run Fast test plan
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh FastTests.log test \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan Fast \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData-fast \
            -resultBundlePath FastTestResults.xcresult \
            -parallel-testing-worker-count 2 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed Fast test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FastTestResults
          path: |
            FastTestResults.xcresult
            FastTests.log
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Build & Test
    # The full macOS build+test is expensive (10x-billed minutes), so it stays
    # nightly/manual only — push and pull_request events skip it and rely on the
    # swift-lint gate above. `needs` makes it wait for the style gate so a
    # nightly run fails fast on style before paying for the compile.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: swift-lint
    # macos-26 is the newest hosted image; it ships Xcode 26.x, which honors
    # SWIFT_DEFAULT_ACTOR_ISOLATION (Swift 6.2). macos-latest still maps to an
    # older image whose Xcode silently ignores that setting and so fails the
    # Swift 6 build. (Local dev is on Xcode 27 beta, which hosted runners lack.)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 is the newest stable on the macos-26 image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      # Cache DerivedData (build intermediates, module cache) to speed up
      # incremental builds. Keyed on the project + sources so a same-commit
      # re-run gets a legitimately warm tree.
      #
      # NO restore-keys prefix fallback (#478): the fallback restored a partial
      # DerivedData from a DIFFERENT commit, and building the test target on top
      # of those stale explicit-module artifacts broke `@testable import
      # CoderPad` resolution ("Unable to resolve module dependency: 'CoderPad'").
      # A clean build (the case when the exact key misses) resolves it fine — so
      # we only ever restore an exact-source-match cache, never a cross-commit
      # one. Builds are nightly/manual, so the occasional clean build is cheap
      # insurance against a flaky stale cache.
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('coderpad.xcodeproj/project.pbxproj', '**/*.swift') }}

      # The shared scheme defaults to the Fast plan (unit + render only) for quick
      # local iteration; CI runs the Full plan so it keeps the UI-test coverage.
      - name: Build & test
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh FullTests.log test \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan Full \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # The standalone SwiftPM packages (the MCP server, the REST client) aren't
      # part of the app's xcodebuild scheme, so their tests need a separate
      # `swift test`. Runs in the same Xcode 26.5 toolchain selected above. Cheap
      # (these packages compile in seconds), so it rides along on the nightly
      # macOS job rather than warranting its own runner.
      - name: Test Swift packages
        run: |
          set -o pipefail
          swift test --package-path CoderPadMCP
          swift test --package-path BuddyAppKit
          swift test --package-path CoderPadDesignSystem

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            FullTests.log

  test-macos15:
    name: Build & Test (macOS 15)
    # #185: the deployment target is macOS 15.0, but the Build & Test job above runs
    # on the macOS 26 image. A runtime regression that only bites the OLDEST supported
    # OS — an unguarded macOS-26-only API, a Sequoia layout difference — would pass
    # there and still ship. This job builds and runs the full suite on a macOS 15
    # (Sequoia) runner, with the newest Swift-6.2 Xcode 26 available on that image,
    # so the app is actually exercised on the floor it claims to support.
    # Nightly/manual only (10x-billed minutes), but failures block the requested run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: swift-lint
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      # The macOS 15 image carries fewer Xcode releases than macOS 26. Select
      # its newest Xcode 26 installation so this compatibility job retains a
      # Swift 6.2 compiler without assuming the macOS 26 image's exact path.
      - name: Select Xcode
        run: |
          set -euo pipefail
          shopt -s nullglob
          xcode_candidates=(/Applications/Xcode_26*.app)
          if (( ${#xcode_candidates[@]} == 0 )); then
            echo "::error::The macOS 15 runner has no Xcode 26 installation."
            exit 1
          fi
          xcode_path="$(
            printf '%s\n' "${xcode_candidates[@]}" |
              sort -V |
              tail -n 1
          )"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      # No DerivedData cache here on purpose: the Build & Test job's cache key is
      # prefixed only by runner.os ("macOS" on both images), so sharing it would
      # cross-pollinate macOS 26 and macOS 15 build artifacts. A clean nightly build
      # on the older image is the safer choice.
      - name: Build & test
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh FullTests-macos15.log test \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan Full \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults-macos15.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TestResults-macos15
          path: |
            TestResults-macos15.xcresult
            FullTests-macos15.log

  tsan:
    name: Thread Sanitizer
    # TSan is ~5-10x slower than a normal test run, so it's deliberately NOT on
    # the nightly schedule — trigger it manually (Actions ▸ Run workflow) before a
    # release or when chasing a data race. It runs the TSan test plan, which turns
    # on Thread Sanitizer (and keeps the Main Thread Checker on) over the full
    # suite. A requested sanitizer run is a blocking signal: any race or test
    # failure fails the workflow.
    if: github.event_name == 'workflow_dispatch'
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 matches the other macOS jobs.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      # No DerivedData cache here (unlike the test job), so this is always a
      # clean build — which resolves `@testable import CoderPad` fine (#478;
      # the failure there came from a stale cross-commit cache, not clean
      # builds).
      - name: Test under Thread Sanitizer
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh TSanTests.log test \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan TSan \
            -destination 'platform=macOS' \
            -resultBundlePath TSanResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload TSan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TSanResults
          path: |
            TSanResults.xcresult
            TSanTests.log

  periphery:
    name: Dead code (Periphery)
    # Periphery needs a full index build, so keep it behind the cheap style gate.
    # The checked-in baseline filters known runtime/platform false positives;
    # any newly introduced dead code fails CI. Configuration lives in
    # .periphery.yml.
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 matches the rest of the macOS jobs — Periphery
      # indexes via the selected Xcode's SourceKit, so it runs after this step.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Install Periphery
        env:
          PERIPHERY_VERSION: 3.8.0
          PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip" \
            -o periphery.zip
          echo "${PERIPHERY_SHA256}  periphery.zip" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/periphery/bin"
          unzip -q periphery.zip -d "${RUNNER_TEMP}/periphery/bin"
          echo "${RUNNER_TEMP}/periphery/bin" >> "$GITHUB_PATH"

      # Reads .periphery.yml. --clean-build forces a fresh index so a cached
      # build can't hide or stale a finding. github-actions formatting surfaces
      # each unused symbol as an inline annotation in the run.
      - name: Scan for dead code
        # --relative-results is required by current Periphery when the
        # github-actions formatter is used (it emits repo-relative paths so the
        # inline annotations resolve).
        run: periphery scan --clean-build --format github-actions --relative-results

  release-build:
    name: Release build
    # The Release configuration compiles with -warn-long-function-bodies=250 /
    # -warn-long-expression-type-checking=250 as warnings-as-errors, so a SwiftUI body
    # whose type-check exceeds 250ms fails ONLY here — never in the Debug `test` build or
    # the lint gate. That trap silently blocked the first distributable release (#427).
    # This is a 10x-billed macOS compile, so it runs nightly + manual rather than on
    # every push to main: release.yml recompiles Release at tag time, so a tripped trap
    # still can't reach a shipped build — nightly just surfaces it within ~24h of the
    # offending commit instead of on the commit itself.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      # Pin an explicit Xcode rather than the image default, which drifts as Apple
      # ships updates. 26.5 is the newest stable on the macos-26 image — and the one
      # release.yml builds with, so it reproduces the type-check budget exactly.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: DerivedDataRelease
          key: deriveddata-release-${{ runner.os }}-${{ hashFiles('coderpad.xcodeproj/project.pbxproj', '**/*.swift') }}

      # Compile only (no test, no signing): the goal is to surface the warnings-as-errors
      # type-check trap, which fails at compile time.
      - name: Build Release
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh ReleaseBuild.log build \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedDataRelease \
            -resultBundlePath ReleaseBuild.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed Release build results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ReleaseBuild
          path: |
            ReleaseBuild.xcresult
            ReleaseBuild.log
          if-no-files-found: warn
          retention-days: 14

  visionos-ui-smoke:
    name: visionOS UI smoke
    # Nightly rather than per-PR because CoreSimulator GUI sessions contend on
    # shared runners. A manual dispatch remains available for focused diagnosis.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      - name: Select Xcode and visionOS simulator
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app
          simulator_id="$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | contains("Apple Vision Pro"))][0].udid // empty')"
          test -n "$simulator_id" || {
            echo "::error::No available Apple Vision Pro simulator was found."
            exit 1
          }
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "VISION_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run targeted spatial smoke
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh VisionSmoke.log test \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan VisionSmoke \
            -destination "platform=visionOS Simulator,id=${VISION_SIMULATOR_ID}" \
            -resultBundlePath VisionSmoke.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -only-testing:coderpadUITests/CoderpadVisionUITests

      - name: Shut down visionOS simulator
        if: always()
        run: xcrun simctl shutdown "${VISION_SIMULATOR_ID}" 2>/dev/null || true

      - name: Upload spatial smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visionos-ui-smoke
          path: |
            VisionSmoke.xcresult
            VisionSmoke.log
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Nightly performance trends
    # Hosted-runner measurements are trend evidence, not microbenchmark truth.
    # Keep them out of PRs and retain repeated runs before setting any gate (#4159).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure private SwiftPM package access
        uses: ./.github/actions/configure-private-swiftpm
        with:
          deploy-key: ${{ secrets.BUDDY_KIT_DEPLOY_KEY }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          scripts/check-xcode-version.sh

      - name: Measure launch and list construction
        run: |
          set -o pipefail
          scripts/run-xcodebuild.sh PerformanceTests.log test \
            -quiet \
            -showBuildTimingSummary \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan Performance \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData-performance \
            -resultBundlePath PerformanceResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize measurements
        if: always()
        run: |
          if [[ -d PerformanceResults.xcresult ]]; then
            summary="$(xcrun xcresulttool get test-results summary --path PerformanceResults.xcresult)"
            {
              echo '### Nightly performance run'
              echo
              jq -r '"Result: \(.result) — \(.passedTests) passed, \(.failedTests) failed"' <<< "$summary"
              echo
              echo 'Compare the retained xcresults across repeated runs before introducing a failure threshold.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PerformanceResults
          path: |
            PerformanceResults.xcresult
            PerformanceTests.log
          if-no-files-found: warn
          retention-days: 30

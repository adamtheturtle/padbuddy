name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
# macOS runners bill at 10x minutes, so not paying for superseded builds matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # macos-26 is the newest hosted image; it ships Xcode 26.x, which honors
    # SWIFT_DEFAULT_ACTOR_ISOLATION (Swift 6.2). macos-latest still maps to an
    # older image whose Xcode silently ignores that setting and so fails the
    # Swift 6 build. (Local dev is on Xcode 27 beta, which hosted runners lack.)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 is the newest stable on the macos-26 image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      # Cache DerivedData (build intermediates, module cache) to speed up
      # incremental builds. Keyed on the project + sources so it invalidates
      # when they change, with a prefix fallback for partial reuse.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('coderpad.xcodeproj/project.pbxproj', '**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

name: CI

on:
  # The cheap lint jobs run on every push/PR (see their `if:` guards below) so
  # style regressions are caught before they reach main. The expensive macOS
  # build+test stays nightly only — macOS runners bill at 10x minutes, so we
  # don't pay for a full compile on every push.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  # Allow manually kicking off a run from the Actions tab when needed.
  workflow_dispatch:

# Cancel an in-progress run when a newer run starts on the same ref.
# macOS runners bill at 10x minutes, so not paying for superseded builds matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint the workflow files themselves: catches invalid syntax, bad expressions,
  # and (via the runner's preinstalled shellcheck) bugs in embedded `run:`
  # scripts. Runs on Linux — cheap, and unrelated to the macOS build.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        # Pin the version for reproducibility; the download script is fetched at
        # the matching tag rather than from main.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          bash <(curl -sSf "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  # Lint the standalone shell scripts. actionlint only covers shell embedded in
  # workflow `run:` blocks, so the scripts under scripts/ and ci_scripts/ would
  # otherwise go unchecked. shellcheck is preinstalled on the runner.
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shellcheck
        run: shellcheck scripts/*.sh ci_scripts/*.sh

  # Swift style gate. Runs on every push/PR (and nightly) so a SwiftLint or
  # SwiftFormat regression is caught before it lands on main, rather than only
  # surfacing in the nightly build. This is the lone macOS job that runs per
  # push — but it just downloads two pinned binaries and lints (~1 min), so it
  # sidesteps the expensive full compile in `test` below. Both tools run as
  # prebuilt binaries at a pinned version so CI matches the local toolchain
  # exactly; bump these in lockstep with any local upgrade.
  swift-lint:
    name: SwiftLint & SwiftFormat
    # macos-26 ships Xcode 26.x; SwiftLint loads SourceKit from the selected
    # Xcode, so it must run on macOS rather than a cheaper Linux runner.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 is the newest stable on the macos-26 image.
      # SwiftLint loads SourceKit from here, so it runs after this step.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: SwiftLint (strict)
        env:
          SWIFTLINT_VERSION: 0.63.3
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q swiftlint.zip swiftlint
          chmod +x swiftlint
          ./swiftlint version
          ./swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (lint)
        env:
          SWIFTFORMAT_VERSION: 0.61.1
        run: |
          set -euo pipefail
          curl -sSfL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q swiftformat.zip swiftformat
          chmod +x swiftformat
          ./swiftformat --version
          ./swiftformat . --lint --reporter github-actions-log

  test:
    name: Build & Test
    # The full macOS build+test is expensive (10x-billed minutes), so it stays
    # nightly/manual only — push and pull_request events skip it and rely on the
    # swift-lint gate above. `needs` makes it wait for the style gate so a
    # nightly run fails fast on style before paying for the compile.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: swift-lint
    # macos-26 is the newest hosted image; it ships Xcode 26.x, which honors
    # SWIFT_DEFAULT_ACTOR_ISOLATION (Swift 6.2). macos-latest still maps to an
    # older image whose Xcode silently ignores that setting and so fails the
    # Swift 6 build. (Local dev is on Xcode 27 beta, which hosted runners lack.)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 is the newest stable on the macos-26 image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      # Cache DerivedData (build intermediates, module cache) to speed up
      # incremental builds. Keyed on the project + sources so it invalidates
      # when they change, with a prefix fallback for partial reuse.
      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('coderpad.xcodeproj/project.pbxproj', '**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      # Build the host app target FIRST, into the same DerivedData, before the
      # test build. On a clean CI build the test target's `@testable import
      # CoderPad` intermittently can't resolve the host module ("Unable to
      # resolve module dependency: 'CoderPad'" / "no such module 'CoderPad'") —
      # the test target compiles before CoderPad.swiftmodule is emitted (#478).
      # The fix is the combination of (a) this prebuild materializing the host
      # module up front and (b) building the test step below with explicit
      # modules OFF — AND these two xcodebuild invocations must use IDENTICAL
      # build settings (hence SWIFT_ENABLE_EXPLICIT_MODULES=NO here too), or the
      # test action sees the app as out-of-date, rebuilds it concurrently with
      # the test target, and the race returns. A warm DerivedData makes the
      # prebuild near-free on cached runs.
      - name: Build host app
        run: |
          set -o pipefail
          xcodebuild build \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # The shared scheme defaults to the Fast plan (unit + render only) for quick
      # local iteration; CI runs the Full plan so it keeps the UI-test coverage.
      #
      # SWIFT_ENABLE_EXPLICIT_MODULES=NO here (not in the host-app build above):
      # with the host module already materialized by the prior step, the test
      # target's explicit-modules dependency scan still fails to resolve
      # 'CoderPad' on a clean CI build (#478). Disabling explicit modules for
      # the test build skips that scan, so the test sources compile by reading
      # the on-disk CoderPad.swiftmodule the prebuild emitted. The app build
      # keeps explicit modules (fast); only the small test target pays for the
      # non-explicit build.
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan Full \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult

  tsan:
    name: Thread Sanitizer
    # TSan is ~5-10x slower than a normal test run, so it's deliberately NOT on
    # the nightly schedule — trigger it manually (Actions ▸ Run workflow) before a
    # release or when chasing a data race. It runs the TSan test plan, which turns
    # on Thread Sanitizer (and keeps the Main Thread Checker on) over the full
    # suite. continue-on-error keeps a newly-surfaced race from reding the run
    # until it's triaged (#458); make it blocking once the suite runs clean.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 matches the other macOS jobs.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      # Build the host app first so the test target can resolve `@testable
      # import CoderPad` on a clean build (#478). Uses the default DerivedData
      # location, which the test step below reuses. Build settings (incl.
      # SWIFT_ENABLE_EXPLICIT_MODULES=NO) must match the test step exactly, or
      # the test action treats the app as out-of-date and rebuilds it
      # concurrently with the test target, re-introducing the race.
      - name: Build host app
        run: |
          set -o pipefail
          xcodebuild build \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -destination 'platform=macOS' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test under Thread Sanitizer
        run: |
          set -o pipefail
          xcodebuild test \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -testPlan TSan \
            -destination 'platform=macOS' \
            -resultBundlePath TSanResults.xcresult \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload TSan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TSanResults
          path: TSanResults.xcresult

  periphery:
    name: Dead code (Periphery)
    # Advisory only. Periphery needs a full index build (as expensive as the
    # `test` job's 10x-billed macOS minutes), so it runs nightly/manual rather
    # than per push, and `continue-on-error` keeps a noisy report from reding the
    # run. Promote it to a blocking gate once the report is proven clean and
    # stable. Config (targets, retain rules) lives in .periphery.yml.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: swift-lint
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin an explicit Xcode rather than the image default, which drifts as
      # Apple ships updates. 26.5 matches the rest of the macOS jobs — Periphery
      # indexes via the selected Xcode's SourceKit, so it runs after this step.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Install Periphery
        # Homebrew ships a prebuilt Periphery; the advisory job doesn't need the
        # exact-version pinning the blocking lint gate uses.
        run: brew install periphery

      # Reads .periphery.yml. --clean-build forces a fresh index so a cached
      # build can't hide or stale a finding. github-actions formatting surfaces
      # each unused symbol as an inline annotation in the run.
      - name: Scan for dead code
        # --relative-results is required by current Periphery when the
        # github-actions formatter is used (it emits repo-relative paths so the
        # inline annotations resolve).
        run: periphery scan --clean-build --format github-actions --relative-results

  release-build:
    name: Release build
    # The Release configuration compiles with -warn-long-function-bodies=250 /
    # -warn-long-expression-type-checking=250 as warnings-as-errors, so a SwiftUI body
    # whose type-check exceeds 250ms fails ONLY here — never in the Debug `test` build or
    # the lint gate. That trap silently blocked the first distributable release (#427),
    # so compile Release on every push to main (where releases are cut from), plus
    # nightly/manual. Skipped on pull_request to limit 10x-billed macOS minutes; the
    # lint gate still runs there.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin an explicit Xcode rather than the image default, which drifts as Apple
      # ships updates. 26.5 is the newest stable on the macos-26 image — and the one
      # release.yml builds with, so it reproduces the type-check budget exactly.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: DerivedDataRelease
          key: deriveddata-release-${{ runner.os }}-${{ hashFiles('coderpad.xcodeproj/project.pbxproj', '**/*.swift') }}
          restore-keys: |
            deriveddata-release-${{ runner.os }}-

      # Compile only (no test, no signing): the goal is to surface the warnings-as-errors
      # type-check trap, which fails at compile time.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project coderpad.xcodeproj \
            -scheme coderpad \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedDataRelease \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

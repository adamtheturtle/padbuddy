# xcodegen manifest for a SEPARATE, verification iPad build of PadBuddy.
#
# This does NOT touch the real `coderpad.xcodeproj`. It generates a throwaway
# `PadBuddyiPad.xcodeproj` over the SAME `coderpad/` sources plus the now-multiplatform
# first-party packages (buddy-kit, FastList, CoderPadToolCore local paths), so the iPad
# migration can be compiled, run, and verified on a real iOS compiler. Sparkle (macOS-only)
# and the macOS widget are excluded; their usage in code is already `#if`-guarded.
#
# Regenerate with:  xcodegen generate --spec project-ipad.yml
name: PadBuddyiPad
options:
  bundleIdPrefix: com.adamdangoor
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  buddy-kit:
    path: ../buddy-kit
  FastList:
    url: https://github.com/adamtheturtle/FastList.git
    from: 0.4.3
  CoderPadKit:
    path: ../CoderPadKit
  CommandPaletteKit:
    path: ../CommandPaletteKit
  CoderPadToolCore:
    path: CoderPadToolCore
  mcp-swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  Highlightr:
    url: https://github.com/raspu/Highlightr
    exactVersion: 2.3.0
  WhatsNewKit:
    url: https://github.com/SvenTiigi/WhatsNewKit.git
    exactVersion: 2.2.1
targets:
  PadBuddyiPad:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: coderpad
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamdangoor.padbuddy.ipad
        PRODUCT_NAME: PadBuddyiPad
        PRODUCT_MODULE_NAME: CoderPad
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
        STRING_CATALOG_GENERATE_SYMBOLS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    dependencies:
      - package: buddy-kit
        product: BuddyDesignSystem
      - package: buddy-kit
        product: BuddyAppKit
      - package: buddy-kit
        product: BuddyMCP
      - package: FastList
        product: FastList
      - package: CoderPadKit
        product: CoderPadKit
      - package: CoderPadKit
        product: CoderPadKitMock
      - package: CommandPaletteKit
        product: CommandPaletteKit
      - package: CoderPadToolCore
        product: CoderPadToolCore
      - package: mcp-swift-sdk
        product: MCP
      - package: Highlightr
        product: Highlightr
      - package: WhatsNewKit
        product: WhatsNewKit
  PadBuddyiPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ipad-uitests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamdangoor.padbuddy.ipad.uitests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_TARGET_NAME: PadBuddyiPad
    dependencies:
      - target: PadBuddyiPad
schemes:
  PadBuddyiPad:
    build:
      targets:
        PadBuddyiPad: all
        PadBuddyiPadUITests: [test]
    test:
      targets:
        - PadBuddyiPadUITests
